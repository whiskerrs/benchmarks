<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading, empty and error states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="width: 1250px; height: 844px; display: flex; gap: 40px; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif">
  <section aria-label="Home loading" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E1D9; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="height: 54px; flex-shrink: 0"></div>
    <div style="height: 44px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Everbloom</span>
    </div>
    <div style="display: flex; gap: 8px; padding: 8px 16px 12px">
      <div style="width: 52px; height: 36px; border-radius: 999px; background: #EDE9E3"></div>
      <div style="width: 110px; height: 36px; border-radius: 999px; background: #EDE9E3"></div>
      <div style="width: 96px; height: 36px; border-radius: 999px; background: #EDE9E3"></div>
      <div style="width: 80px; height: 36px; border-radius: 999px; background: #EDE9E3"></div>
    </div>
    <div style="margin: 4px 16px 0; height: 240px; border-radius: 12px; background: #EDE9E3"></div>
    <div style="padding: 28px 16px 12px"><div style="width: 120px; height: 18px; border-radius: 4px; background: #EDE9E3"></div></div>
    <div style="display: flex; gap: 12px; padding: 0 16px">
      <div style="flex-shrink: 0; width: 140px; height: 175px; border-radius: 8px; background: #EDE9E3"></div>
      <div style="flex-shrink: 0; width: 140px; height: 175px; border-radius: 8px; background: #EDE9E3"></div>
      <div style="flex-shrink: 0; width: 140px; height: 175px; border-radius: 8px; background: #EDE9E3"></div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; border-top: 1px solid #E6E1D9; background: #FFFFFF"></div>
  </section>
  <section aria-label="Empty cart" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E1D9; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="height: 54px; flex-shrink: 0"></div>
    <div style="height: 44px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700">Cart</h2>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 32px 83px; text-align: center">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6E6A63" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      <span style="font-size: 17px; font-weight: 700">Your cart is empty</span>
      <span style="font-size: 15px; line-height: 22px; color: #6E6A63">Items you add will appear here.</span>
      <a href="Main.dc.html" style="margin-top: 8px; height: 48px; padding: 0 24px; border-radius: 12px; background: #1C1B19; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center">Start shopping</a>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; border-top: 1px solid #E6E1D9; background: #FFFFFF"></div>
  </section>
  <section aria-label="Load error" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; border: 1px solid #E6E1D9; box-sizing: border-box; display: flex; flex-direction: column">
    <div style="height: 54px; flex-shrink: 0"></div>
    <div style="height: 44px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
      <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Everbloom</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 32px 83px; text-align: center">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6E6A63" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.5h.01"/></svg>
      <span style="font-size: 17px; font-weight: 700">Couldn’t load products</span>
      <span style="font-size: 15px; line-height: 22px; color: #6E6A63">Check your connection and try again.</span>
      <button type="button" style="margin-top: 8px; height: 48px; padding: 0 24px; border-radius: 12px; border: 1px solid #1C1B19; background: #FFFFFF; color: #1C1B19; font: inherit; font-size: 16px; font-weight: 600">Retry</button>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; border-top: 1px solid #E6E1D9; background: #FFFFFF"></div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1250,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
