<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
input::placeholder{color:#6E6A63}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
  <div style="height: 54px; flex-shrink: 0"></div>
  <div style="padding: 4px 16px 12px; flex-shrink: 0">
    <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search products</label>
    <div style="height: 44px; border-radius: 12px; background: #F4F1EC; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6E6A63">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" value="{{query}}" onInput="{{onQuery}}" placeholder="Search products" style="flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font: inherit; font-size: 16px; color: #1C1B19">
    </div>
  </div>
  <sc-if value="{{hasQuery}}" hint-placeholder-val="{{true}}">
    <p style="margin: 0; padding: 4px 16px 8px; font-size: 13px; color: #6E6A63">81 results</p>
    <ul style="list-style: none; margin: 0; padding: 0">
      <sc-for list="{{results}}" as="p" hint-placeholder-count="6">
        <li>
          <a href="Product.dc.html" style="display: flex; gap: 12px; align-items: center; padding: 8px 16px">
            <img src="{{p.img}}" alt="" style="width: 64px; height: 85px; object-fit: cover; border-radius: 8px; background: #F4F1EC; flex-shrink: 0; display: block">
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
              <span style="font-size: 15px; line-height: 20px">{{p.title}}</span>
              <span style="font-size: 15px; font-weight: 700">{{p.price}}</span>
            </span>
          </a>
        </li>
      </sc-for>
    </ul>
  </sc-if>
  <sc-if value="{{noQuery}}" hint-placeholder-val="{{false}}">
    <div style="padding: 48px 32px; text-align: center; color: #6E6A63; font-size: 15px; line-height: 22px">Search across 995 products by name.</div>
  </sc-if>
  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding-bottom: 34px; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="Search.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1C1B19; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </a>
    <a href="Cart.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Cart
      <span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #B4361E; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const query = (this.state && this.state.query) ?? 'jacket';
return {
query,
hasQuery: query.trim() !== '',
noQuery: query.trim() === '',
onQuery: (e) => this.setState({ query: e.target.value }),
results: [
{ title: 'Taupe Jacket', price: '$120.00', img: '../img/u3.jpg' },
{ title: 'Linen Blend Jacket', price: '$75.00', img: '../img/u1.jpg' },
{ title: 'Organic Cotton Jacket', price: '$120.00', img: '../img/u2.jpg' },
{ title: 'Unisex Cotton Blend Jacket', price: '$75.00', img: '../img/u4.jpg' },
{ title: 'Minimalist linen trench coat in mushroom', price: '$264.00', img: '../img/u5.jpg' },
{ title: 'Casual Relaxed Fit Jacket', price: '$75.00', img: '../img/u6.jpg' }
]
};
}
}
</script>
</body>
</html>
