<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="height: 44px; padding: 0 8px; display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; flex-shrink: 0">
    <a href="Main.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <span style="font-size: 17px; font-weight: 600; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Urban Transit Essentials</span>
    <span></span>
  </header>
  <div style="padding: 4px 16px 0; flex-shrink: 0">
    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #6E6A63">Functional layers in earthy muted tones and organic linen and cotton for daily commutes.</p>
  </div>
  <div role="radiogroup" aria-label="Sort" style="display: flex; gap: 8px; padding: 12px 16px; flex-shrink: 0; overflow: hidden">
    <sc-for list="{{sorts}}" as="s" hint-placeholder-count="4">
      <sc-if value="{{s.selected}}" hint-placeholder-val="{{false}}">
        <button type="button" role="radio" aria-checked="true" onClick="{{s.pick}}" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #1C1B19; background: #1C1B19; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 600; white-space: nowrap">{{s.label}}</button>
      </sc-if>
      <sc-if value="{{s.unselected}}" hint-placeholder-val="{{true}}">
        <button type="button" role="radio" aria-checked="false" onClick="{{s.pick}}" style="flex-shrink: 0; height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #E6E1D9; background: #FFFFFF; color: #1C1B19; font: inherit; font-size: 13px; font-weight: 500; white-space: nowrap">{{s.label}}</button>
      </sc-if>
    </sc-for>
  </div>
  <div style="padding: 0 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; row-gap: 20px">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="6">
      <a href="Product.dc.html" style="display: flex; flex-direction: column; gap: 8px">
        <img src="{{p.img}}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #F4F1EC; display: block">
        <span style="font-size: 14px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.title}}</span>
        <span style="font-size: 15px; font-weight: 700">{{p.price}}</span>
      </a>
    </sc-for>
  </div>
  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding-bottom: 34px; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1C1B19; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </a>
    <a href="Cart.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Cart
      <span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #B4361E; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.sort) || 'featured';
const sorts = [
{ id: 'featured', label: 'Featured' },
{ id: 'best', label: 'Best selling' },
{ id: 'asc', label: 'Price: low to high' },
{ id: 'desc', label: 'Price: high to low' }
].map((s) => ({ ...s, selected: s.id === picked, unselected: s.id !== picked, pick: () => this.setState({ sort: s.id }) }));
return {
sorts,
products: [
{ title: 'Linen Blend Jacket', price: '$75.00', img: '../img/u1.jpg' },
{ title: 'Organic Cotton Jacket', price: '$120.00', img: '../img/u2.jpg' },
{ title: 'Taupe Jacket', price: '$120.00', img: '../img/u3.jpg' },
{ title: 'Unisex Cotton Blend Jacket', price: '$75.00', img: '../img/u4.jpg' },
{ title: 'Minimalist linen trench coat in mushroom', price: '$264.00', img: '../img/u5.jpg' },
{ title: 'Casual Relaxed Fit Jacket', price: '$75.00', img: '../img/u6.jpg' }
]
};
}
}
</script>
</body>
</html>
