<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="width: 390px; height: 1420px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="height: 44px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0">
    <span style="font-size: 22px; font-weight: 700; letter-spacing: -0.4px">Everbloom</span>
  </header>
  <nav aria-label="Collections" style="display: flex; gap: 8px; padding: 8px 16px 12px; overflow: hidden; flex-shrink: 0">
    <sc-for list="{{chips}}" as="chip" hint-placeholder-count="4">
      <a href="Collection.dc.html" style="flex-shrink: 0; height: 36px; padding: 0 14px; border-radius: 999px; background: #F4F1EC; color: #1C1B19; font-size: 14px; font-weight: 500; display: flex; align-items: center; white-space: nowrap">{{chip}}</a>
    </sc-for>
  </nav>
  <a href="Collection.dc.html" style="margin: 4px 16px 0; height: 240px; border-radius: 12px; overflow: hidden; position: relative; display: block; flex-shrink: 0; background: #F4F1EC">
    <img src="../img/u5.jpg" alt="" style="width: 100%; height: 100%; object-fit: cover; object-position: center 30%; display: block">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 16px; background: rgba(28, 27, 25, 0.72); color: #FFFFFF; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase">Featured collection</span>
      <span style="font-size: 20px; font-weight: 700">Urban Transit Essentials</span>
      <span style="font-size: 14px">Shop now</span>
    </div>
  </a>
  <section style="padding: 28px 0 0; flex-shrink: 0">
    <div style="padding: 0 16px 12px; display: flex; align-items: baseline; justify-content: space-between">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Collections</h2>
      <a href="Collection.dc.html" style="font-size: 14px; font-weight: 600; color: #6E6A63">See all</a>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
      <sc-for list="{{collections}}" as="c" hint-placeholder-count="3">
        <a href="Collection.dc.html" style="flex-shrink: 0; width: 140px; display: flex; flex-direction: column; gap: 8px">
          <img src="{{c.img}}" alt="" style="width: 140px; height: 175px; object-fit: cover; border-radius: 8px; background: #F4F1EC; display: block">
          <span style="font-size: 14px; font-weight: 600; line-height: 18px">{{c.title}}</span>
        </a>
      </sc-for>
    </div>
  </section>
  <section style="padding: 28px 16px 0; flex-shrink: 0">
    <h2 style="margin: 0 0 12px; font-size: 17px; font-weight: 700">Best sellers</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 12px; row-gap: 20px">
      <sc-for list="{{sale}}" as="p" hint-placeholder-count="4">
        <a href="Product.dc.html" style="display: flex; flex-direction: column; gap: 8px">
          <img src="{{p.img}}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 8px; background: #F4F1EC; display: block">
          <span style="font-size: 14px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.title}}</span>
          <span style="display: flex; gap: 6px; align-items: baseline">
            <span style="font-size: 15px; font-weight: 700; color: #B4361E">{{p.price}}</span>
            <s style="font-size: 13px; color: #6E6A63">{{p.compare}}</s>
          </span>
        </a>
      </sc-for>
    </div>
  </section>
  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding-bottom: 34px; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1C1B19; font-size: 11px; font-weight: 600">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </a>
    <a href="Cart.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Cart
      <span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #B4361E; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">3</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1420}}'>
class Component extends DCLogic {
renderVals() {
return {
chips: ['Urban Transit Essentials', 'Quiet Morning Loungewear', 'Structured Workday Staples', 'Coastal Afternoon Knits', 'Active Movement Gear'],
collections: [
{ title: 'Quiet Morning Loungewear', img: '../img/q1.jpg' },
{ title: 'Coastal Afternoon Knits', img: '../img/k1.jpg' },
{ title: 'Everyday Footwear Basics', img: '../img/f1.jpg' },
{ title: 'Precision Crafted Timepieces', img: '../img/w1.jpg' }
],
sale: [
{ title: 'Cotton Sweater', price: '$45.00', compare: '$58.50', img: '../img/k3.jpg' },
{ title: 'Relaxed-Fit Knit Sweater in Mango Glow', price: '$68.00', compare: '$88.40', img: '../img/k5.jpg' },
{ title: 'Cotton Cashmere Lounge Top', price: '$78.00', compare: '$101.40', img: '../img/k6.jpg' },
{ title: 'Classic Beige Low-Top Sneaker', price: '$120.00', compare: '$156.00', img: '../img/f4.jpg' }
]
};
}
}
</script>
</body>
</html>
