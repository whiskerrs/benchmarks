<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cart</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
  <div style="height: 54px; flex-shrink: 0"></div>
  <header style="height: 44px; padding: 0 16px; display: flex; align-items: center; flex-shrink: 0">
    <h1 style="margin: 0; font-size: 22px; font-weight: 700">Cart</h1>
  </header>
  <ul style="list-style: none; margin: 0; padding: 0 16px; flex-shrink: 0">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="3">
      <li style="display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #E6E1D9">
        <img src="{{l.img}}" alt="" style="width: 80px; height: 107px; object-fit: cover; border-radius: 8px; background: #F4F1EC; flex-shrink: 0; display: block">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
          <span style="font-size: 15px; line-height: 20px; font-weight: 600">{{l.title}}</span>
          <span style="font-size: 13px; color: #6E6A63">{{l.variant}}</span>
          <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between">
            <div style="display: flex; align-items: center; border: 1px solid #E6E1D9; border-radius: 12px; height: 36px">
              <button type="button" aria-label="Decrease quantity" onClick="{{l.dec}}" style="width: 36px; height: 34px; border: 0; background: transparent; color: #1C1B19; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg>
              </button>
              <span aria-live="polite" style="min-width: 24px; text-align: center; font-size: 15px; font-weight: 600">{{l.qty}}</span>
              <button type="button" aria-label="Increase quantity" onClick="{{l.inc}}" style="width: 36px; height: 34px; border: 0; background: transparent; color: #1C1B19; display: flex; align-items: center; justify-content: center">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              </button>
            </div>
            <span style="font-size: 15px; font-weight: 700">{{l.total}}</span>
          </div>
        </div>
      </li>
    </sc-for>
  </ul>
  <div style="position: absolute; left: 0; right: 0; bottom: 83px; box-sizing: border-box; padding: 16px; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-size: 15px">Subtotal</span>
      <span style="font-size: 17px; font-weight: 700">{{subtotal}}</span>
    </div>
    <span style="font-size: 13px; color: #6E6A63">Taxes and shipping are calculated at checkout.</span>
    <a href="https://demostore.hydrogen.mock.shop/checkout" style="height: 52px; border-radius: 12px; background: #1C1B19; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Check out</a>
  </div>
  <nav aria-label="Tabs" style="position: absolute; left: 0; right: 0; bottom: 0; height: 83px; box-sizing: border-box; padding-bottom: 34px; background: #FFFFFF; border-top: 1px solid #E6E1D9; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      Home
    </a>
    <a href="Search.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #6E6A63; font-size: 11px; font-weight: 500">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      Search
    </a>
    <a href="Cart.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #1C1B19; font-size: 11px; font-weight: 600; position: relative">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
      Cart
      <sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
        <span style="position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #B4361E; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{count}}</span>
      </sc-if>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const base = [
{ id: 'jacket', title: 'Organic Cotton Jacket', variant: 'Size: S', price: 120, img: '../img/u2.jpg' },
{ id: 'sweater', title: 'Cotton Sweater', variant: 'Size: M', price: 45, img: '../img/k3.jpg' },
{ id: 'sneaker', title: 'Classic Beige Low-Top Sneaker', variant: 'Size: 9', price: 120, img: '../img/f4.jpg' }
];
const qty = (this.state && this.state.qty) || { jacket: 1, sweater: 1, sneaker: 1 };
const money = (n) => '$' + n.toFixed(2);
const set = (id, n) => this.setState({ qty: { ...qty, [id]: Math.max(0, n) } });
const lines = base.filter((b) => qty[b.id] > 0).map((b) => ({
...b,
qty: qty[b.id],
total: money(b.price * qty[b.id]),
inc: () => set(b.id, qty[b.id] + 1),
dec: () => set(b.id, qty[b.id] - 1)
}));
const count = lines.reduce((a, l) => a + l.qty, 0);
return {
lines,
count,
hasItems: count > 0,
subtotal: money(lines.reduce((a, l) => a + l.price * l.qty, 0))
};
}
}
</script>
</body>
</html>
