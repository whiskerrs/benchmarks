<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Product detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#1C1B19;text-decoration:none}a:hover{color:#1C1B19}
</style>
</helmet>
<div style="width: 390px; height: 1300px; position: relative; overflow: hidden; background: #FFFFFF; color: #1C1B19; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Roboto, 'Helvetica Neue', Arial, sans-serif; display: flex; flex-direction: column">
  <div style="width: 390px; height: 520px; position: relative; flex-shrink: 0; background: #F4F1EC">
    <img src="{{image}}" alt="Organic Cotton Jacket, image {{imageNumber}} of 3" style="width: 100%; height: 100%; object-fit: cover; display: block">
    <a href="Collection.dc.html" aria-label="Back" style="position: absolute; top: 54px; left: 12px; width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg>
    </a>
    <div style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; justify-content: center; gap: 4px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="3">
        <button type="button" aria-label="Show image {{d.n}}" onClick="{{d.pick}}" style="width: 24px; height: 24px; padding: 0; border: 0; background: transparent; display: flex; align-items: center; justify-content: center">
          <span style="width: 8px; height: 8px; border-radius: 999px; background: {{d.color}}; display: block"></span>
        </button>
      </sc-for>
    </div>
  </div>
  <div style="padding: 20px 16px 0; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0">
    <h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 700">Organic Cotton Jacket</h1>
    <span style="font-size: 20px; font-weight: 700">$120.00</span>
  </div>
  <fieldset style="margin: 24px 0 0; padding: 0 16px; border: 0; flex-shrink: 0">
    <legend style="float: left; width: 100%; padding: 0 0 12px; font-size: 15px; font-weight: 600">Size: <span style="font-weight: 400; color: #6E6A63">{{sizeLabel}}</span></legend>
    <div style="display: flex; gap: 8px">
      <sc-for list="{{sizes}}" as="s" hint-placeholder-count="3">
        <sc-if value="{{s.selected}}" hint-placeholder-val="{{false}}">
          <button type="button" aria-pressed="true" onClick="{{s.pick}}" style="min-width: 56px; height: 44px; padding: 0 16px; border-radius: 12px; border: 2px solid #1C1B19; background: #FFFFFF; color: #1C1B19; font: inherit; font-size: 15px; font-weight: 600">{{s.label}}</button>
        </sc-if>
        <sc-if value="{{s.unselected}}" hint-placeholder-val="{{true}}">
          <button type="button" aria-pressed="false" onClick="{{s.pick}}" style="min-width: 56px; height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid #E6E1D9; background: #FFFFFF; color: #1C1B19; font: inherit; font-size: 15px; font-weight: 500">{{s.label}}</button>
        </sc-if>
      </sc-for>
    </div>
  </fieldset>
  <section style="padding: 24px 16px 0; flex-shrink: 0">
    <h2 style="margin: 0 0 8px; font-size: 15px; font-weight: 600">Description</h2>
    <p style="margin: 0; font-size: 15px; line-height: 22px; color: #3D3A35">A saddle brown organic cotton jacket with a focus on its texture and stitching. This outerwear piece is designed for a clean, minimalist aesthetic.</p>
  </section>
  <section style="padding: 32px 0 0; flex-shrink: 0">
    <h2 style="margin: 0 0 12px; padding: 0 16px; font-size: 17px; font-weight: 700">You may also like</h2>
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow: hidden">
      <sc-for list="{{recs}}" as="p" hint-placeholder-count="3">
        <a href="Product.dc.html" style="flex-shrink: 0; width: 140px; display: flex; flex-direction: column; gap: 6px">
          <img src="{{p.img}}" alt="" style="width: 140px; height: 187px; object-fit: cover; border-radius: 8px; background: #F4F1EC; display: block">
          <span style="font-size: 14px; line-height: 18px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{p.title}}</span>
          <span style="font-size: 14px; font-weight: 700">{{p.price}}</span>
        </a>
      </sc-for>
    </div>
  </section>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 12px 16px 34px; background: #FFFFFF; border-top: 1px solid #E6E1D9">
    <a href="Cart.dc.html" style="height: 52px; border-radius: 12px; background: #1C1B19; color: #FFFFFF; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center">Add to cart · $120.00</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const img = st.img ?? 0;
const size = st.size ?? 'S';
const images = ['../img/u2.jpg', '../img/d2.jpg', '../img/d3.jpg'];
return {
image: images[img],
imageNumber: img + 1,
dots: images.map((_, i) => ({ n: i + 1, color: i === img ? '#1C1B19' : 'rgba(28, 27, 25, 0.25)', pick: () => this.setState({ img: i }) })),
sizeLabel: size,
sizes: ['XS', 'S', 'M'].map((s) => ({ label: s, selected: s === size, unselected: s !== size, pick: () => this.setState({ size: s }) })),
recs: [
{ title: 'Linen Blend Jacket', price: '$75.00', img: '../img/u1.jpg' },
{ title: 'Taupe Jacket', price: '$120.00', img: '../img/u3.jpg' },
{ title: 'Unisex Cotton Blend Jacket', price: '$75.00', img: '../img/u4.jpg' },
{ title: 'Minimalist linen trench coat in mushroom', price: '$264.00', img: '../img/u5.jpg' }
]
};
}
}
</script>
</body>
</html>
