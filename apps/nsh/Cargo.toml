[package]
name = "everbloom"
version = "1.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "src/lib.rs"

# NSH 0.4.0 from its Git tag: the crates.io package of nsh-platform-ios 0.4.0
# does not build (it includes a file from outside the crate), so the app and
# the runners nsh generates take every NSH crate from this one checkout.
[dependencies]
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.4.0" }
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.4.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", tag = "v0.4.0", default-features = false }
