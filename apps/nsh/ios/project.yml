# The iOS project, for xcodegen (`xcodegen generate` in ios/ writes
# Everbloom.xcodeproj, which is committed: building needs no xcodegen).
name: Everbloom
options:
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    SUPPORTS_MACCATALYST: NO
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Everbloom:
    type: application
    platform: iOS
    sources:
      - path: Everbloom
        excludes: ["Info.plist"]
    settings:
      base:
        PRODUCT_NAME: Everbloom
        PRODUCT_BUNDLE_IDENTIFIER: dev.whiskerrs.shopbench.nsh
        INFOPLIST_FILE: Everbloom/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        RUST_TARGET[sdk=iphoneos*]: aarch64-apple-ios
        RUST_TARGET[sdk=iphonesimulator*]: aarch64-apple-ios-sim
        RUST_LIB: $(PROJECT_DIR)/rust/target/$(RUST_TARGET)/release/libeverbloom_ios.a
        OTHER_LDFLAGS:
          - $(RUST_LIB)
          - -framework UIKit
          - -framework Foundation
          - -framework CoreFoundation
          - -framework CoreGraphics
          - -framework CoreText
          - -framework QuartzCore
          - -framework ImageIO
          - -framework Metal
          - -liconv
          - -lobjc
        DEAD_CODE_STRIPPING: YES
        CLANG_ENABLE_OBJC_ARC: YES
      configs:
        Release:
          DEPLOYMENT_POSTPROCESSING: YES
          STRIP_INSTALLED_PRODUCT: YES
          STRIP_STYLE: all
          COPY_PHASE_STRIP: YES
          GCC_OPTIMIZATION_LEVEL: s
          DEBUG_INFORMATION_FORMAT: dwarf
    preBuildScripts:
      - name: Build Rust
        script: '"$PROJECT_DIR/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(RUST_LIB)
  EverbloomUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [EverbloomUITests]
    dependencies:
      - target: Everbloom
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.whiskerrs.shopbench.nsh.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Everbloom
        SWIFT_VERSION: "5.0"
schemes:
  Everbloom:
    build:
      targets:
        Everbloom: all
        EverbloomUITests: [test]
    run:
      config: Release
    test:
      config: Release
      targets: [EverbloomUITests]
    archive:
      config: Release
